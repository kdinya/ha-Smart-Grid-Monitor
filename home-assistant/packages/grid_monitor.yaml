# Optional Home Assistant package.
# Enable packages in configuration.yaml before using this file:
# homeassistant:
#   packages: !include_dir_named packages
#
# Entity IDs assume the default ESPHome slug: grid_monitor.
# Adjust them if Home Assistant generated different IDs.

template:
  - sensor:
      - name: "Grid Monitor Power Source"
        unique_id: grid_monitor_power_source
        icon: >-
          {% set source = states('sensor.grid_monitor_power_source_status') %}
          {% if source == 'pzem_online_source_unconfirmed' %}mdi:transmission-tower
          {% elif source == 'pzem_offline_source_unknown' %}mdi:help-circle-outline
          {% else %}mdi:help-circle-outline{% endif %}
        state: >-
          {% set source = states('sensor.grid_monitor_power_source_status') %}
          {% if source == 'pzem_online_source_unconfirmed' %}
            PZEM онлайн; джерело живлення ESP не підтверджене
          {% elif source == 'pzem_offline_source_unknown' %}
            PZEM не відповідає; джерело живлення невідоме
          {% else %}
            Очікується відповідь PZEM
          {% endif %}
        attributes:
          source_state: >-
            {% set source = states('sensor.grid_monitor_power_source_status') %}
            {% if source == 'pzem_online_source_unconfirmed' %}pzem_online_source_unconfirmed
            {% elif source == 'pzem_offline_source_unknown' %}pzem_offline_source_unknown
            {% else %}unknown{% endif %}

  - binary_sensor:
      - name: "Grid Monitor Healthy"
        unique_id: grid_monitor_healthy
        device_class: connectivity
        state: >-
          {{ is_state('binary_sensor.grid_monitor_esp_status', 'on')
             and is_state('binary_sensor.grid_monitor_pzem_online', 'on')
             and is_state('binary_sensor.grid_monitor_voltage_out_of_range', 'off') }}
        attributes:
          reason: >-
            {% set pzem = states('sensor.grid_monitor_power_source_status') %}
            {% if states('binary_sensor.grid_monitor_esp_status') in ['unknown', 'unavailable'] %}Стан ESP невідомий
            {% elif is_state('binary_sensor.grid_monitor_esp_status', 'off') %}ESP недоступна
            {% elif pzem == 'pzem_offline_source_unknown' %}PZEM не відповідає; джерело живлення невідоме
            {% elif states('binary_sensor.grid_monitor_pzem_online') in ['unknown', 'unavailable'] %}Стан зв’язку з PZEM невідомий
            {% elif pzem != 'pzem_online_source_unconfirmed' %}Очікується достовірна телеметрія PZEM
            {% elif is_state('binary_sensor.grid_monitor_voltage_out_of_range', 'on') %}Напруга поза діапазоном
            {% elif states('binary_sensor.grid_monitor_voltage_out_of_range') in ['unknown', 'unavailable'] %}Якість напруги невідома
            {% else %}Усі контрольовані стани доступні, напруга в заданому діапазоні{% endif %}
