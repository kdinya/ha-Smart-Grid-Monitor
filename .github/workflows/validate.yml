name: Fast validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fast-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the small test dependency
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Check card syntax
        run: node --check grid-monitor-card.js
      - name: Check HACS manifest
        run: python -m json.tool hacs.json > /dev/null
      - name: Compile Python checks
        run: python -m compileall -q esphome tests
      - name: Run fast repository tests
        run: python -m unittest discover -s tests -v
